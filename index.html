<!DOCTYPE html>
<html>
    <head>
        <title>
            Registration Form
        </title>
    </head>
    <body>
        <p>Technovision 2026</p>
        <h1>Event Registration</h1>
        <form action="">
            <fieldset>
                <legend>Team Details</legend>
                <div>
                    <div>
                        <label for="team-name">Team Name</label><br>
                        <input id = "team-name" name="teamName" type="text" placeholder="Enter your team name"><br>
                    </div>
                    <div>
                        <label for="team-leader">Leader Name</label><br>
                        <input id="team-leader" name ="teamLeader" type="text" placeholder="Enter team leader's name here..."><br>
                    </div>

                    <div>
                        <label for="team-leader">Leader Contact</label><br>
                        <input id="team-leader" name ="teamLeader_contact" type="number" placeholder="Enter team leader's Contact here..."><br>
                    </div>
                    <div>
                        <label for="team-leader">Leader email</label><br>
                        <input id="team-leader" name ="teamLeader_contact" type="email" placeholder="Enter team leader's Email here..."><br>
                    </div>
                    <div>
                        <label for="team-leader">Leader </label><br>
                        <label for="games">Choose your games:</label>
                        <select id="games" name="games[]" multiple size="3" required>
                        <option value="module-presentation">Module Presentation</option>
                        <option value="robo-rumble">Robo Rumble</option>
                        <option value="bot-racing">Bot Racing</option>
                        </select>
                    </div>
                    <div>
                        <label for="team-leader">Leader Contact</label><br>
                        <input id="team-leader" name ="teamLeader_contact" type="number" placeholder="Enter team leader's Contact here..."><br>
                    </div>
                </div>
            </fieldset>


        </form>    
    </body>
</html>
